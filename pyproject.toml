[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-studio"
version = "0.2.0"
description = "Self-hosted browser-managed SIP voice agent platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "cryptography>=50,<51",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pyyaml>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["voice_agent_studio*"]

[tool.setuptools.package-data]
voice_agent_studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
