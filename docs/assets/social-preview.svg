<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Voice Agent Studio</title>
  <desc id="desc">Self-hosted AI voice agent connected directly to an existing SIP PBX.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1e3654"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".98"/><stop offset="1" stop-color="#e8f0f7" stop-opacity=".98"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#050b15" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1140" cy="-40" r="280" fill="#2ac5a5" opacity=".12"/>
  <circle cx="70" cy="660" r="260" fill="#57a7ff" opacity=".12"/>
  <g font-family="Inter,Arial,sans-serif" fill="#fff">
    <text x="74" y="96" font-size="22" font-weight="700" fill="#62e0c4">VOICE AGENT STUDIO</text>
    <text x="74" y="177" font-size="56" font-weight="800">Your PBX.</text>
    <text x="74" y="238" font-size="56" font-weight="800">Your AI voice agent.</text>
    <text x="76" y="286" font-size="22" fill="#c5d3e2">Self-hosted · Direct SIP · No Asterisk required</text>
    <rect x="76" y="330" width="294" height="52" rx="26" fill="#28c7a4"/>
    <text x="111" y="364" font-size="18" font-weight="700" fill="#07151c">Configure from the browser</text>
    <text x="76" y="548" font-size="18" fill="#a9bdd0">Open source · AGPL-3.0 · Docker</text>
  </g>
  <g transform="translate(650 70)" filter="url(#shadow)">
    <rect width="550" height="470" rx="18" fill="url(#card)"/>
    <rect width="550" height="62" rx="18" fill="#17283d"/>
    <circle cx="28" cy="31" r="6" fill="#ff6d70"/><circle cx="48" cy="31" r="6" fill="#ffc857"/><circle cx="68" cy="31" r="6" fill="#44d19d"/>
    <text x="100" y="37" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Voice Agent Studio</text>
    <rect x="25" y="92" width="150" height="340" rx="10" fill="#e5edf4"/>
    <rect x="43" y="112" width="80" height="10" rx="5" fill="#17283d"/><rect x="43" y="150" width="108" height="8" rx="4" fill="#9fb2c3"/><rect x="43" y="180" width="92" height="8" rx="4" fill="#9fb2c3"/><rect x="43" y="210" width="110" height="8" rx="4" fill="#9fb2c3"/>
    <rect x="43" y="248" width="106" height="34" rx="8" fill="#c8f3e8"/><rect x="55" y="260" width="72" height="8" rx="4" fill="#159b80"/>
    <text x="202" y="116" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#17283d">Tu agente de voz</text>
    <text x="202" y="145" font-family="Inter,Arial,sans-serif" font-size="14" fill="#668096">Estado general de la instalación</text>
    <rect x="202" y="174" width="145" height="74" rx="10" fill="#d9f7ef"/><text x="220" y="202" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#126c5b">Cuenta SIP</text><text x="220" y="226" font-family="Inter,Arial,sans-serif" font-size="13" fill="#159b80">● Registrado</text>
    <rect x="363" y="174" width="145" height="74" rx="10" fill="#e8eef4"/><text x="381" y="202" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#17283d">Proveedor IA</text><text x="381" y="226" font-family="Inter,Arial,sans-serif" font-size="13" fill="#668096">Configurado</text>
    <rect x="202" y="274" width="306" height="128" rx="10" fill="#f3f7fa"/><text x="220" y="305" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17283d">Prueba rápida del flujo</text><rect x="220" y="328" width="202" height="32" rx="6" fill="#fff" stroke="#d4e0e8"/><rect x="430" y="328" width="60" height="32" rx="6" fill="#17283d"/><text x="444" y="349" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">Simular</text><text x="220" y="382" font-family="Inter,Arial,sans-serif" font-size="12" fill="#159b80">✓ Consentimiento determinístico</text>
  </g>
</svg>
