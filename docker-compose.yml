services:
  studio:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      VAS_MASTER_KEY_FILE: /run/secrets/master_key
      VAS_DATA_DIR: /data
      VAS_BIND_HOST: ${VAS_BIND_HOST:-127.0.0.1}
      VAS_BIND_PORT: ${VAS_HTTP_PORT:-8080}
      VAS_SECURE_COOKIES: ${VAS_SECURE_COOKIES:-false}
      VAS_PIPER_MODEL: ${VAS_PIPER_MODEL:-}
      VAS_PIPER_COMMAND: ${VAS_PIPER_COMMAND:-piper}
    secrets:
      - master_key
    volumes:
      - studio-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETPCAP, SETUID]
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('VAS_BIND_PORT','8080')+'/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  studio-data:

secrets:
  master_key:
    file: ./secrets/master_key
